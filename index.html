<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placenta Study Atlas</title>
    <meta name="description" content="GEO placental gene expression studies with workbook evidence notes">
    <link rel="stylesheet" href="/placenta-research-database/static/style.css?v=20260813-4">
</head>

<body>
    <nav class="topbar">
        <a class="brand" href="/placenta-research-database/">Placenta Study Atlas</a>
        <div class="nav-links">
            <a class="active" href="/placenta-research-database/">Index</a>
            <a href="/placenta-research-database/repository.html">Studies</a>
        </div>
    </nav>

    <main class="page-shell">
        <section class="atlas-hero">
            <div class="atlas-hero-copy">
                <p class="eyebrow">GEO study index</p>
                <h1>Placenta Study Atlas</h1>
                <p class="hero-copy">
                    Search placental studies by organism, pregnancy timing, assay,
                    phenotype, or publication.
                </p>
            </div>
            <form action="/placenta-research-database/repository.html" method="GET" class="atlas-search">
                <label for="atlas-search-input">Search studies</label>
                <div class="search-row">
                    <input id="atlas-search-input" class="search-input" type="search" name="q"
                        placeholder="GSE ID, title, organism, assay, phenotype">
                    <button class="primary-btn" type="submit">Find</button>
                </div>
            </form>
        </section>

        <section class="atlas-stats" aria-label="Atlas overview">
            <div>
                <span>GEO records</span>
                <strong>1,721</strong>
            </div>
            <div>
                <span>Total samples</span>
                <strong>21,768</strong>
            </div>
            <div>
                <span>Publication-linked records</span>
                <strong>1,396</strong>
            </div>
            <div>
                <span>Organisms</span>
                <strong>9</strong>
            </div>
        </section>

    </main>

</body>

</html>
